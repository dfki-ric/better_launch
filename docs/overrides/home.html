{% extends "main.html" %}

<!-- Render hero under tabs -->
{% block tabs %}
  {{ super() }}

  <!-- Additional styles for landing page -->
  <style>
    /* Disable scrolling on the front page */
    body {
      height: 100%;
      overflow: hidden;
    }
    /* Application header should be static for the landing page */
    .md-header {
      position: initial;
    }

    /* Remove spacing, as we cannot hide it completely */
    .md-main__inner {
      margin: 0;
    }

    /* Hide main content for now */
    .md-content {
      display: none;
    }

    /* Hide other content from main like the footer */
    .md-main {
      display: none;
    }

    /* Custom color for the header on the hero page */
    .md-header {
      background: rgba(13, 14, 18, 1);
    }
    .md-tabs {
      background: rgba(13, 14, 18, 1);
    }

    /* Hide table of contents */
    @media screen and (min-width: 60em) {
      .md-sidebar--secondary {
        display: none;
      }
    }

    /* Hide navigation */
    @media screen and (min-width: 76.25em) {
      .md-sidebar--primary {
        display: none;
      }
    }
  </style>

  <!-- Hero for landing page -->
  <section class="mdx-container">
    <!-- No md-grid container, we want to fill the full page -->
    <div class="md-typeset">
      <div class="mdx-hero">

        <!-- Hero image -->
        <div class="mdx-hero__image">
          <img
            src="assets/images/hero_corrvyd.jpg"
            alt="Created by Corrvyd, https://artistree.io/corrvyd <3"
            draggable="false"
          >
          <!--<img
            src="assets/images/hero_large.jpg"
            alt="Generated by ChatGPT, human art coming soon!"
            draggable="false"
          >-->
        </div>

        <!-- Hero content -->
        <div class="mdx-hero__content">
          <h1>better_launch</h1>
          <p>A better replacement for the ROS2 launch system:</p>
          <p>intuitive, simple, memorable.</p>
          <a
            href="about/why/"
            title="About"
            class="md-button md-button--primary"
          >
            About
          </a>
        </div>
      </div>
    </div>
  </section>
{% endblock %}

<!-- Content -->
{% block content %}{% endblock %}

<!-- Application footer -->
{% block footer %}{% endblock %}
